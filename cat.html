<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyexsDock Cat</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
      .cat-desktop { position: relative; width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
      .cat-mascot { width: auto; flex: none; }
      .cat-mascot.pixel { image-rendering: pixelated; }
      /* The notch's wardrobe, wrapped to fit the 140 px window: colours, then outfits three per row. */
      .cat-wardrobe { position: absolute; top: 4px; left: 4px; right: 4px; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; background: rgba(20, 20, 22, 0.96); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; }
      .cat-wardrobe-colors { display: flex; gap: 4px; }
      .cat-wardrobe-outfits { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
      .cat-wardrobe-swatch { width: 18px; height: 18px; padding: 0; border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; cursor: pointer; }
      .cat-wardrobe-swatch:hover, .cat-wardrobe-swatch:focus-visible, .cat-wardrobe-swatch.active { border-color: #fff; outline: none; }
      .cat-wardrobe-item { display: flex; flex-direction: column; align-items: center; width: 38px; padding: 1px 1px 2px; color: #fff; font-size: 8.5px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; background: rgba(255, 255, 255, 0.06); border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
      .cat-wardrobe-item:hover, .cat-wardrobe-item:focus-visible, .cat-wardrobe-item.active { border-color: rgba(255, 255, 255, 0.5); outline: none; }
      .cat-wardrobe-item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .cat-wardrobe-item .cat-mascot { pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/cat-main.tsx"></script>
  </body>
</html>
