<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyexsDock Cat</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
      .cat-desktop { position: relative; width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
      .cat-mascot { width: auto; flex: none; }
      .cat-mascot.pixel { image-rendering: pixelated; }
      /* The notch's wardrobe, wrapped to fit the 140 px window. */
      .cat-wardrobe { position: absolute; top: 4px; left: 4px; right: 4px; z-index: 50; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 6px; background: rgba(20, 20, 22, 0.96); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; }
      .cat-wardrobe-item { display: flex; align-items: center; justify-content: center; height: 34px; min-width: 34px; padding: 2px 6px; color: #fff; font-size: 11px; background: rgba(255, 255, 255, 0.06); border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
      .cat-wardrobe-item:hover, .cat-wardrobe-item:focus-visible, .cat-wardrobe-item.active { border-color: rgba(255, 255, 255, 0.5); outline: none; }
      .cat-wardrobe-item img { height: 28px; width: auto; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/cat-main.tsx"></script>
  </body>
</html>
